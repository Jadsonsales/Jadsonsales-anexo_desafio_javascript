<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ford</title>    
    <link href="css/reset.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/form.css" rel="stylesheet">
    <script src="js/form.js"></script>
</head>
<body>
    <header>       
        <div>
            <img src="img/logo-ford-256.png" width="150" class="logo" />
        </div>
        <nav>
            <ul>
                <li>
                    <a href="index.html">Home</a>
                </li>
                <li>
                    <a href="lancamento.html">Lançamento</a>
                </li>
                <li>
                    <a href="contato.html">Contato</a>
                </li>
            </ul>
        </nav>

    </header>
    <main>
    <div class="forms">
        <div class="container-imagem">
            <img src="img/xls 2.2 diesel.jpg" alt="Ford Ranger">
        </div>

        <div class="container-formulario">
            <h2 class="titulo">Sobre Você</h2>
            <form onsubmit="Post(event, this);">
                <input type="text" id="nome" name="nome" placeholder="NOME*" class="fordform" required>
                <input type="email" id="email" name="email" placeholder="E-MAIL*" class="fordform" required>
                <input type="text" id="telefone" name="telefone" placeholder="TELEFONE*" class="fordform" required>
                
                <select id="tipoContato" name="tipoContato" class="fordform" required>
                    <option value="" disabled selected>TIPO DE CONTATO*</option>
                    <option value="Elogio">Elogio</option>
                    <option value="Reclamação">Reclamação</option>
                    <option value="Solicitação">Solicitação</option>
                </select>

                <textarea id="mensagem" name="mensagem" placeholder="MENSAGEM*" class="fordform" style="height: 80px; resize: none;" required></textarea>

                <div class="lgpd-secao">
                    <p class="lgpd-texto">
                        Os dados serão mantidos em nossa base de dados, só enquanto for desejado por você. 
                        A qualquer momento, será possível editar ou remover tais dados. 
                        <a href="https://www.ford.com.br/politica-de-privacidade/" target="_blank">Termos e Condições.</a>
                    </p>
                    
                    <div class="checkbox-container">
                        <input type="checkbox" id="termos" name="termos" onchange="validarConsentimento()">
                        <label for="termos">Sim. Li e concordo com os Termos. </label>
                       
                    </div>
                    
                    <div class="checkbox-container">
                        <input type="checkbox" id="novidades" name="novidades">
                        <label for="novidades">Sim. Também quero receber descontos e novidades.</label>
                    </div>
                </div>

                <button type="submit" id="btn-enviar" disabled>Enviar</button> 
            </form>
        </div>
    </div>
</main>
    <footer>
        <nav id="social">
            <ul>
                <li><span class="redesociais">Redes Sociais</span></li>
                <li><a href="#" title="Facebook"><img src="img/facebook-50.png"></a></li>
                <li><a href="#" title="YouTube"><img src="img/youtube-squared-50.png"></a></li>
                <li><a href="#" title="Instagram"><img src="img/instagram-logo-50.png"></a></li>
            </ul>
        </nav>
        <div>
           <img src="img/ford-96.png" width="70"  />
        </div>
    </footer>    
</body>
</html>
